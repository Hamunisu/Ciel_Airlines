<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="google-site-verification" content="-4HcycOWpw4rSgbkx3AGwFK7GxwtJ6dm2RdSgNKrd2E" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="バーチャルエアライン Ciel Japan Airlines(CJA) 便名・路線検索システム(MSFS / X-Plane対応) | 出発地・到着地を入力するだけで便名を検索。生成されたSimbriefリンクからスムーズにVAフライトブランを作成できます。" />
        <meta http-equiv="Content-Security-Policy" content= "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' data:;" />
        <link rel="icon" type="image/png" href="./assets/favicon/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="./assets/favicon/favicon.svg" />
        <link rel="shortcut icon" href="./assets/favicon/favicon.ico" />
        <link rel="apple-touch-icon-precomposed" href="./assets/favicon/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="Ciel Japan Airlines" />
        <link rel="manifest" href="./assets/favicon/site.webmanifest" />

        <!-- SNS -->
        <meta property="og:title" content="Ciel Japan Airlines" />
        <meta property="og:description" content="バーチャルエアライン Ciel Japan Airlines 専用便名・路線検索システム" />
        <meta property="og:type" content="website" />
        <meta property="og:image" content="https://hamunisu.github.io/Ciel_Airlines/assets/logo/cielFinalAlpha_lite.PNG" />

        <!-- Twitter(X) -->
        <meta name="twitter:card" content="summary_large_image" />

        <link rel="stylesheet" href="./main.css" />

        <title>Ciel Japan Airlines</title>
    </head>
    <body>
        <div class="main_framework home_main_framework">
            <div class="main_container home_main_container">
                <div class="logo_framework home_logo_framework">
                    <a href="./index.html">
                        <div class="logo_container">
                            <picture>
                                <source srcset="./assets/logo/cielFinalAlphaWhite_lite.PNG" media="(prefers-color-scheme: dark)" />
                                <img src="./assets/logo/cielFinalAlpha_lite.PNG" alt="Ciel Logo" width="200" height="50" fetchpriority="high"/>
                            </picture>
                        </div>
                    </a>
                    <p class="version">v2.1.3</p>
                </div>

                <main class="search_frame">
                    <div class="input_box_frame">
                        <input id="dep" type="text" placeholder="Departure" aria-label="出発空港を入力" maxlength="4" autofocus />
                        <input id="arr" type="text" placeholder="Arrival" aria-label="到着空港を入力" maxlength="4" />
                    </div>
                    <div id="enter"></div>
                    <div id="result">
                        <p>空港名をICAOまたはIATAで入力し、Enterを押してください</p>
                    </div>
                </main>
            </div>

            <footer>
                <div class="footer_framework">
                    <div class="footer_link">
                        <!-- <a href="./html/ticket.html">チケット</a> -->
                        <a href="./html/version.html">バージョン履歴</a>
                        <a href="./html/licenses.html">ライセンスについて</a>
                        <a href="./html/credits.html">クレジット</a>
                    </div>
                    <p class="copy">&copy; 2026 Hamunisu / Ciel Japan Airlines</p>

                        本サイトに掲載されている情報は、Microsoft Flight SimulatorおよびX-Planeでの利用を目的とした架空のデータであり、
                        実在の企業・団体とは一切関係ありません。実際の運航には絶対に使用しないでください。
                    </p>
                </div>
            </footer>
        </div>
        <script type="module" src="./js/wasm.js"></script>
    </body>
</html>
